name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows bundle and attach to release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm --clean EQTravelMap.spec

      - name: Zip bundle
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "EQTravelMap-$tag-windows.zip"
          Compress-Archive -Path dist/EQTravelMap/* -DestinationPath $zip
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
