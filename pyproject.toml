[project]
name = "everquest-travel-map"
version = "0.1.0"
description = "Generate a visual travel map and play summary from EverQuest character log files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alex Burtness" }]
keywords = ["everquest", "p99", "project1999", "logs", "map", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pyside6>=6.6",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "pyinstaller>=6.0",
    "ruff>=0.1",
    "black>=23.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/test_*", "src/conftest.py"]

[tool.coverage.report]
# Minimum overall line coverage. Enforced in CI via the `coverage` job
# in .github/workflows/test.yml. The gap to 100% lives almost entirely
# in the Qt UI and drawing layers — see TEST_COVERAGE_FINDINGS.md.
fail_under = 85
show_missing = true
skip_covered = false
