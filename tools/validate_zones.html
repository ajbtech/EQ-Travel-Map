<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zone Center Validator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #1a1a1a; color: #ddd; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#loader {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; gap: 16px;
}
#loader h1 { font-size: 22px; color: #eee; }
#loader p { color: #aaa; font-size: 14px; }
#loader input[type=file] { display: none; }
#load-btn {
  padding: 12px 28px; font-size: 16px; background: #3a6ea5; color: white;
  border: none; border-radius: 6px; cursor: pointer;
}
#load-btn:hover { background: #4a7ec0; }

#app { display: none; flex: 1; flex-direction: row; overflow: hidden; }

#canvas-wrap {
  flex: 1; position: relative; overflow: hidden; background: #000; cursor: crosshair;
}
canvas { display: block; }

#panel {
  width: 288px; min-width: 288px; background: #242424; border-left: 1px solid #333;
  display: flex; flex-direction: column; padding: 12px; gap: 8px; overflow-y: auto;
}

#progress { font-size: 12px; color: #888; text-align: center; }
#zone-name { font-size: 17px; font-weight: bold; color: #f0c060; word-break: break-word; }
#aliases { font-size: 12px; color: #888; white-space: pre-wrap; }
#coords { font-family: monospace; font-size: 12px; color: #ccc; white-space: pre; }
#pending-coords { font-family: monospace; font-size: 12px; color: #e8a040; white-space: pre; min-height: 2em; }
#status { font-size: 12px; color: #6c6; min-height: 1.4em; text-align: center; }

.spacer { flex: 1; }

button {
  padding: 8px; font-size: 14px; border: none; border-radius: 4px;
  cursor: pointer; font-weight: bold;
}
#approve-btn { background: #2d6e2d; color: #9f9; }
#approve-btn:hover { background: #3a8a3a; }
#nav { display: flex; gap: 6px; }
#prev-btn, #next-btn { flex: 1; background: #3a3a3a; color: #ccc; }
#prev-btn:hover, #next-btn:hover { background: #4a4a4a; }
#prev-btn:disabled, #next-btn:disabled { opacity: 0.3; cursor: not-allowed; }
#export-btn { background: #1a4a6e; color: #8cf; }
#export-btn:hover { background: #2a5a8e; }
#jump-row { display: flex; gap: 6px; align-items: center; }
#jump-row input { flex: 1; background: #333; border: 1px solid #555; color: #ccc; border-radius: 4px; padding: 5px; font-size: 13px; }
#jump-btn { padding: 5px 10px; background: #444; color: #ccc; font-size: 13px; }

hr { border-color: #444; }
</style>
</head>
<body>

<div id="loader">
  <h1>Zone Center Validator</h1>
  <p>Select <strong>zone_map.png</strong> from the project root to begin.</p>
  <button id="load-btn" onclick="document.getElementById('file-in').click()">Open zone_map.png</button>
  <input type="file" id="file-in" accept="image/png,image/*">
  <p id="load-err" style="color:#e55;display:none"></p>
</div>

<div id="app">
  <div id="canvas-wrap"><canvas id="map-canvas"></canvas></div>
  <div id="panel">
    <div id="progress"></div>
    <div id="zone-name"></div>
    <div id="aliases"></div>
    <hr>
    <div id="coords"></div>
    <div id="pending-coords"></div>
    <div class="spacer"></div>
    <button id="approve-btn">✓  Approve</button>
    <div id="nav">
      <button id="prev-btn">← Prev</button>
      <button id="next-btn">Next →</button>
    </div>
    <div id="jump-row">
      <input id="jump-in" type="number" min="1" placeholder="Jump to #" title="Jump to zone number">
      <button id="jump-btn">Go</button>
    </div>
    <button id="export-btn">⬇  Export JSON</button>
    <div id="status"></div>
  </div>
</div>

// ── State ─────────────────────────────────────────────────────────────────────
const MAP_W = 2700, MAP_H = 1550;
let mapImg = null;
let zones = [];        // sorted zone names
let origCenter = {};   // name -> [x, y] (read-only original)
let working = {};      // name -> [x, y] (approved values)
let pending = {};      // name -> [x, y] | null (clicked but not yet approved)
let modified = new Set();
let currentIdx = 0;
let aliasIndex = {};   // canonical name -> [log name, ...]

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  // Build alias reverse index
  for (const [log, canonical] of Object.entries(ZONE_GRAPH.aliases)) {
    if (!aliasIndex[canonical]) aliasIndex[canonical] = [];
    aliasIndex[canonical].push(log);
  }

  zones = Object.keys(ZONE_GRAPH.nodes).sort();
  for (const name of zones) {
    const c = ZONE_GRAPH.nodes[name].center;
    origCenter[name] = [...c];
    working[name] = [...c];
    pending[name] = null;
  }

  document.getElementById('file-in').addEventListener('change', onFileChosen);
  document.getElementById('approve-btn').addEventListener('click', approve);
  document.getElementById('prev-btn').addEventListener('click', () => goTo(currentIdx - 1));
  document.getElementById('next-btn').addEventListener('click', () => goTo(currentIdx + 1));
  document.getElementById('export-btn').addEventListener('click', exportJson);
  document.getElementById('jump-btn').addEventListener('click', () => {
    const n = parseInt(document.getElementById('jump-in').value, 10);
    if (!isNaN(n) && n >= 1 && n <= zones.length) goTo(n - 1);
  });
  document.getElementById('jump-in').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('jump-btn').click();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'n') document.getElementById('next-btn').click();
    else if (e.key === 'ArrowLeft' || e.key === 'p') document.getElementById('prev-btn').click();
    else if (e.key === 'Enter' || e.key === 'a') approve();
  });

  window.addEventListener('resize', () => { if (mapImg) render(); });
}

// ── File loading ──────────────────────────────────────────────────────────────
function onFileChosen(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      mapImg = img;
      document.getElementById('loader').style.display = 'none';
      const app = document.getElementById('app');
      app.style.display = 'flex';
      setupCanvas();
      goTo(0);
    };
    img.onerror = () => {
      document.getElementById('load-err').textContent = 'Failed to load image.';
      document.getElementById('load-err').style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Canvas setup ──────────────────────────────────────────────────────────────
function setupCanvas() {
  const canvas = document.getElementById('map-canvas');
  const wrap = document.getElementById('canvas-wrap');
  canvas.addEventListener('click', onCanvasClick);
  // Initial size handled by render()
}

function getDisplayRect() {
  const wrap = document.getElementById('canvas-wrap');
  const availW = wrap.clientWidth;
  const availH = wrap.clientHeight;
  const scale = Math.min(availW / MAP_W, availH / MAP_H);
  const dw = Math.floor(MAP_W * scale);
  const dh = Math.floor(MAP_H * scale);
  const ox = Math.floor((availW - dw) / 2);
  const oy = Math.floor((availH - dh) / 2);
  return { ox, oy, dw, dh, scale };
}

function render() {
  const canvas = document.getElementById('map-canvas');
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const { ox, oy, dw, dh, scale } = getDisplayRect();
  ctx.drawImage(mapImg, ox, oy, dw, dh);

  const name = zones[currentIdx];
  const [cx, cy] = pending[name] || working[name];
  const px = ox + cx * scale;
  const py = oy + cy * scale;

  // Crosshair
  ctx.save();
  ctx.strokeStyle = '#FF2222';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(ox, py); ctx.lineTo(ox + dw, py); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px, oy); ctx.lineTo(px, oy + dh); ctx.stroke();

  // Circle
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py, 11, 0, 2 * Math.PI); ctx.stroke();

  // Dot fill
  ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
  ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fill();

  // Coordinate label near crosshair
  const label = `(${cx}, ${cy})`;
  ctx.font = 'bold 13px monospace';
  const tw = ctx.measureText(label).width;
  let lx = px + 14;
  let ly = py - 10;
  if (lx + tw > ox + dw) lx = px - tw - 14;
  if (ly < oy + 16) ly = py + 22;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(lx - 3, ly - 13, tw + 6, 18);
  ctx.fillStyle = '#FF8888';
  ctx.fillText(label, lx, ly);
  ctx.restore();
}

// ── Canvas click ──────────────────────────────────────────────────────────────
function onCanvasClick(e) {
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const { ox, oy, dw, dh, scale } = getDisplayRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const lx = cx - ox;
  const ly = cy - oy;
  if (lx < 0 || ly < 0 || lx > dw || ly > dh) return;
  const mx = Math.round(lx / scale);
  const my = Math.round(ly / scale);
  const name = zones[currentIdx];
  pending[name] = [mx, my];
  updatePanel();
  render();
}

// ── Navigation ────────────────────────────────────────────────────────────────
function goTo(idx) {
  if (idx < 0 || idx >= zones.length) return;
  currentIdx = idx;
  updatePanel();
  render();
}

// ── Approve ───────────────────────────────────────────────────────────────────
function approve() {
  const name = zones[currentIdx];
  const p = pending[name];
  const status = document.getElementById('status');
  if (p) {
    working[name] = [...p];
    pending[name] = null;
    modified.add(name);
    status.textContent = `✓ Set to (${p[0]}, ${p[1]})`;
    status.style.color = '#6c6';
  } else {
    status.textContent = '✓ Approved (no change)';
    status.style.color = '#888';
  }
  // Auto-advance
  if (currentIdx < zones.length - 1) goTo(currentIdx + 1);
  else { updatePanel(); render(); }
}

// ── Panel update ──────────────────────────────────────────────────────────────
function updatePanel() {
  const name = zones[currentIdx];
  const total = zones.length;
  const star = modified.has(name) ? ' ✎' : '';

  document.getElementById('progress').textContent =
    `Zone ${currentIdx + 1} / ${total}${star}  (${modified.size} modified)`;

  document.getElementById('zone-name').textContent = name;

  const als = aliasIndex[name] || [];
  document.getElementById('aliases').textContent =
    als.length ? 'Log aliases:\n' + als.map(a => '  ' + a).join('\n') : 'Aliases: (none)';

  const orig = origCenter[name];
  const curr = working[name];
  const origStr = `Original:  (${orig[0]}, ${orig[1]})`;
  const currStr = orig[0] === curr[0] && orig[1] === curr[1]
    ? '' : `\nCurrent:   (${curr[0]}, ${curr[1]})`;
  document.getElementById('coords').textContent = origStr + currStr;

  const p = pending[name];
  document.getElementById('pending-coords').textContent =
    p ? `Pending:   (${p[0]}, ${p[1]})\n→ click Approve to commit` : '';

  document.getElementById('prev-btn').disabled = currentIdx === 0;
  document.getElementById('next-btn').disabled = currentIdx === total - 1;

  // Clear status unless just set by approve()
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportJson() {
  const out = JSON.parse(JSON.stringify(ZONE_GRAPH)); // deep clone
  for (const name of zones) {
    out.nodes[name].center = working[name];
  }
  const text = JSON.stringify(out, null, 2) + '\n';
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zone_graph.json';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('status').textContent =
    `Downloaded zone_graph.json (${modified.size} change${modified.size === 1 ? '' : 's'})`;
  document.getElementById('status').style.color = '#8cf';
}

init();
</script>
